# GC10-DET training configuration for the ZYNQ-7010 deployment route.
#
# This file becomes usable after the stage-0 preprocessing job creates the
# images/ and labels/ directories below.  Do not point YOLOv5 at
# GC10-DET-COCO directly: its annotations are COCO JSON and its images have
# not yet been cropped/resized to the deployment ROI contract.

# YOLOv5 v7 resolves relative dataset paths from third_party/yolov5.
path: ../../data/GC10-DET-YOLO-ROI256
train: images/train
val: images/val
test: images/test

nc: 10
names:
  0: 1_chongkong
  1: 2_hanfeng
  2: 3_yueyawan
  3: 4_shuiban
  4: 5_youban
  5: 6_siban
  6: 7_yiwu
  7: 8_yahen
  8: 9_zhehen
  9: 10_yaozhe
